<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Competitive Exam and Current Affairs Mock Test Portal</title>
    <meta name="description" content="A centralized preparation platform for UPSC, SSC, Banking, Railways, and government recruitment exams featuring daily current affairs, subject-wise mock tests, automated scoring, category cutoffs, and performance analytics." />
    <meta property="og:title" content="Competitive Exam and Current Affairs Mock Test Portal" />
    <meta property="og:description" content="A centralized preparation platform for UPSC, SSC, Banking, Railways, and government recruitment exams featuring daily current affairs, subject-wise mock tests, automated scoring, category cutoffs, and performance analytics." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('portal_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
